server.modules += ( "mod_auth", "mod_authn_file", "mod_authn_jwt", "mod_cgi" )

auth.backend = "jwt"

auth.backend.jwt.opts = (
    "algorithm" => "RS256",
    "keyfile" => "/etc/ssl/public.pem"
)

auth.require = (
    "" => (
        "method" => "bearer",
        "realm" => "Test",
        "require" => "valid-user"
    ),
)

$HTTP["url"] =~ "^/audience" {
    auth.backend.jwt.opts = (
        "algorithm" => "RS256",
        "keyfile" => "/etc/ssl/public.pem",
        "audience" => "the-audience"
    )
}

$HTTP["url"] =~ "^/issuer" {
    auth.backend.jwt.opts = (
        "algorithm" => "RS256",
        "keyfile" => "/etc/ssl/public.pem",
        "issuer" => "the-issuer"
    )
}

$HTTP["url"] =~ "^/subject" {
    auth.backend.jwt.opts = (
        "algorithm" => "RS256",
        "keyfile" => "/etc/ssl/public.pem",
	"subject" => "the-subject"
    )
}

$HTTP["url"] =~ "^/remote-user" {
    cgi.assign = ( ".sh" => "" )
}
